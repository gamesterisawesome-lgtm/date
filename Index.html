<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You?</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fff5f5;
            overflow: hidden; 
            position: relative;
        }

        .media-container {
            width: 250px;
            height: 250px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
        }

        .media-container img, 
        .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            z-index: 10;
        }

        .btn-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 200px;
            z-index: 10;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 20px;
            top: -30px;
            z-index: 1;
            transform-origin: center;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="media-container" id="mediaBox">
        <!-- Starts as your local image -->
        <img id="statusImg" src="pwease.jpeg" alt="Waiting...">
    </div>

    <h1 id="question">Will you go out on a date with me?</h1>

    <div class="btn-container">
        <button id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
    </div>

    <!-- Look here: This points directly to your local boom.mp3 file to skip browser blocks! -->
    <audio id="successSound" src="boom.mp3" preload="auto"></audio>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const mediaBox = document.getElementById('mediaBox');
        const successSound = document.getElementById('successSound');

        const phrases = [
            "Are you sure?",
            "You're hurting me...",
            "You're breaking my heart 💔",
            "Think again!",
            "Is that your final answer?",
            "Wait, let's reconsider...",
            "Please? 🥺",
            "Just click YES!"
        ];

        let phraseIndex = 0;
        let yesScale = 1;
        let noScale = 1;

        noBtn.addEventListener('click', () => {
            noBtn.textContent = phrases[phraseIndex];
            phraseIndex = (phraseIndex + 1) % phrases.length;

            yesScale += 0.3;
            noScale -= 0.08;

            yesBtn.style.transform = `scale(${yesScale})`;
            noBtn.style.transform = `scale(${Math.max(noScale, 0.4)})`;
        });

        yesBtn.addEventListener('click', () => {
            question.textContent = "Yay! Best decision ever! 🎉❤️";
            
            // 1. Fire your local audio boom track
            successSound.play().catch(e => console.log("Audio play allowed on human gesture!", e));

            // 2. Drop standard multi-colored confetti pieces
            spawnNormalConfetti();
            
            // 3. NOTICE: The "muted" attribute has been completely removed below!
            // The video will now play with full sound active instantly.
            mediaBox.innerHTML = `
                <video id="statusVideo" autoplay loop playsinline>
                    <source src="cutesy.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            `;
            
            document.querySelector('.btn-container').style.display = 'none';
        });

        function spawnNormalConfetti() {
            const colors = ['#ff4081', '#00e676', '#00b0ff', '#ffea00', '#d500f9', '#ff6d00'];
            for (let i = 0; i < 100; i++) {
                const piece = document.createElement('div');
                piece.classList.add('confetti-piece');
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
                piece.style.animationDelay = (Math.random() * 1.5) + 's';
                piece.style.width = (Math.random() * 6 + 6) + 'px';
                piece.style.height = (Math.random() * 12 + 12) + 'px';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 4000);
            }
        }
    </script>

</body>
</html>
